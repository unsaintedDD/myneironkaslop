            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .sentence-box {
            padding: 20px;
        }
        .eng-sentence {
            font-size: 18px;
            color: #1e293b;
            line-height: 1.5;

        }

            padding: 2px 6px;
            border-radius: 4px;
            font-style: normal;
            font-weight: 600;
        }
        .ukr-text {
            font-size: 15px;
            color: #64748b;
        }

            display: flex;
            gap: 40px;
        }
        .term-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .term-label {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 0.05em;
        }

            font-size: 16px;

            color: #0f172a;
        }
        .term-ukr {
            font-size: 14px;
            color: #475569;

</head>

        { v: "Stand by", b: " ", t: "to switch to manual steering", a: ".", s: "Будь напоготові перейти на ручне рульове управління.", tu: "перейти на ручне рульове управління", vu: "бути напоготові" },
        { v: "Come in", b: " the ", t: "navigation bridge", a: ".", s: "Заходь на навігаційний місток.", tu: "навигаційний / штурманський місток", vu: "заходити" },
        { v: "Keep on", b: " ", t: "to carry out activities", a: ".", s: "Продовжуй виконувати роботу.", tu: "здійснювати діяльність / виконувати роботу", vu: "продовжувати" },
        { v: "Go out", b: " ", t: "to keep a lookout", a: ".", s: "Вийди, щоб вести спостереження.", tu: "вести спостереження", vu: "виходити" },
        { v: "Call back", b: " ", t: "a lookout", a: ".", s: "Поклич назад спостерігача.", tu: "спостерігач (матрос)", vu: "покликати назад" },
        { v: "Look forward to", b: " ", t: "clear visibility", a: ".", s: "Чекай з нетерпінням на хорошу видимість.", tu: "хороша видимість", vu: "чекати з нетерпінням" },
        { v: "Carry on", b: " with ", t: "efficient navigation", a: ".", s: "Продовжуй ефективне судноводіння.", tu: "ефективне судноводіння", vu: "продовжувати" },
        { v: "Turn on", b: " the ", t: "Automatic Radar Plotting Aid (ARPA)", a: ".", s: "Увімкни САРП.", tu: "засоби автоматичного радіолокаційного прокладання курсу (САРП)", vu: "вмикати" },
        { v: "Check out", b: " the ", t: "Automatic Identification System (AIS)", a: ".", s: "Перевір автоматичну систему розпізнавання (AIS).", tu: "автоматична система розпізнавання", vu: "перевіряти" },
        { v: "Look up", b: " the ", t: "International Maritime Organization (IMO)", a: " rules.", s: "Пошукай правила Міжнародної Морської Організації.", tu: "Міжнародна Морськая Організація", vu: "шукати інформацію" },
        { v: "Look out", b: " for ", t: "Dangerous Goods (DG)", a: ".", s: "Будь обережним з небезпечними вантажами.", tu: "небезпечні вантажі", vu: "бути обережним" },
        { v: "Set up", b: " the ", t: "Electronic Chart Display and Information System (ECDIS)", a: ".", s: "Налаштуй електронну картографічну навігаційну систему інформування.", tu: "електронна картографічна навігаційна система (ECDIS)", vu: "налаштовувати" },
        { v: "Call back", b: " the ", t: "Vessel Traffic Service (VTS)", a: ".", s: "Передзвони в службу керування руху суден.", tu: "служба керування руху суден (VTS)", vu: "передзвонити" },
        { v: "Turn on", b: " the ", t: "Global Positioning System (GPS)", a: ".", s: "Увімкни систему глобального позиціювання (GPS).", tu: "система глобального позиціювання (GPS)", vu: "вмикати" }
    ];

    let globalCounter = 1;

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function renderBlock(container, items, title) {
        const titleEl = document.createElement('div');
        titleEl.className = 'section-title';
        titleEl.textContent = title;
        container.appendChild(titleEl);

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';

            const numberCol = document.createElement('div');
            numberCol.className = 'card-number';
            numberCol.textContent = globalCounter++;

            const contentCol = document.createElement('div');
            contentCol.className = 'card-content';
            
            // Верхній блок: речення
            const topBox = document.createElement('div');
            topBox.className = 'sentence-box';
            topBox.innerHTML = `
                <div class="eng-sentence"><strong>${item.v}</strong>${item.b}<i>${item.t}</i>${item.a}</div>
                <div class="ukr-text">${item.s}</div>
            `;

            // Нижній блок: деталі
            const bottomBox = document.createElement('div');
            bottomBox.className = 'terms-box';
            bottomBox.innerHTML = `
                <div class="term-col">
                    <span class="term-label">Термін (Навігація)</span>
                    <span class="term-eng">${capitalize(item.t)}</span>
                    <span class="term-ukr">${capitalize(item.tu)}</span>
                </div>
                <div class="term-col">
                    <span class="term-label">Фразове дієслово</span>
                    <span class="term-eng">${capitalize(item.v)}</span>
                    <span class="term-ukr">${capitalize(item.vu)}</span>
                </div>
            `;

            contentCol.appendChild(topBox);
            contentCol.appendChild(bottomBox);
            card.appendChild(numberCol);
            card.appendChild(contentCol);
            
            container.appendChild(card);
        });
    }

    const app = document.getElementById('app');
    
    if (vocab1.length > 0) {
        renderBlock(app, vocab1, 'Вокаблюар 1');
    }
    
    if (vocab2.length > 0) {
        renderBlock(app, vocab2, 'Вокаблюар 2');
    }

</script>
</body>
</html>
