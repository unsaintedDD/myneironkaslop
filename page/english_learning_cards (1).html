        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderCards();
            });
        }

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault(); 
                    document.getElementById('searchInput').focus();
                }
            });
        }

        function switchTopic(topicId) {
            currentTopic = topicId;
            currentCategory = 'Усі'; 
            
            const tabs = ['topic1', 'topic12', 'topicOther'];
            tabs.forEach(tab => {
                const btn = document.getElementById(`btn-${tab}`);
                if (tab === topicId) {
                    btn.className = "border-b-2 border-blue-400 text-white font-medium px-1 py-5 transition-colors";
                } else {
                    btn.className = "border-b-2 border-transparent text-gray-300 hover:text-white hover:border-gray-400 font-medium px-1 py-5 transition-colors";
                }
            });

            const sidebar = document.getElementById('sidebar');
            const emptyState = document.getElementById('empty-state');
            const cardsContainer = document.getElementById('cards-container');

            if (topicId === 'topic1') {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('md:block');
                emptyState.classList.add('hidden');
                cardsContainer.classList.remove('hidden');
                setupSidebar();
                renderCards();
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('md:block');
                emptyState.classList.remove('hidden');
                cardsContainer.classList.add('hidden');
            }
        }

        function setupSidebar() {
            const sidebarNav = document.getElementById('sidebar-nav');
            const categories = ['Усі', ...new Set(vocabularyData.map(item => item.category))];
            
            sidebarNav.innerHTML = categories.map(category => `
                <button onclick="setCategory('${category}')" 
                        class="w-full text-left px-3 py-2 rounded-md text-sm font-medium transition-colors 
                        ${currentCategory === category ? 'bg-[#4d4d4d] text-white shadow-inner border border-gray-500' : 'text-gray-300 hover:bg-[#5c5c5c]'}">
                    ${category}
                </button>
            `).join('');
        }

        window.setCategory = function(category) {
            currentCategory = category;
            setupSidebar(); 
            renderCards();
        }
        
        function renderCards() {
            if (currentTopic !== 'topic1') return;

            const container = document.getElementById('cards-container');
            const noResults = document.getElementById('no-results');
            
            const filteredData = vocabularyData.filter(item => {
                const matchCategory = currentCategory === 'Усі' || item.category === currentCategory;
                const searchStr = `${item.word} ${item.translation} ${item.examples.past.sentence} ${item.examples.present.sentence} ${item.examples.future.sentence}`.toLowerCase();
                const matchSearch = searchStr.includes(searchQuery);
                return matchCategory && matchSearch;
            });

            if (filteredData.length === 0) {
                container.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            // Генеруємо картки
            container.innerHTML = filteredData.map(item => `
                <div class="bg-[#4d4d4d] rounded-[2rem] shadow-lg border-2 border-[#6b6b6b] overflow-hidden p-6 md:p-10">
                    
                    <div class="mb-8 flex flex-wrap items-baseline gap-3">
                        <h2 class="text-4xl font-extrabold text-white tracking-wide">${item.word}</h2>
                        <span class="text-xl text-gray-300 italic">(${item.translation})</span>
                    </div>
                    
                    <div class="space-y-6">
                        ${renderExample('PAST', 'bg-red-100 text-red-700', item.examples.past, item.word)}
                        ${renderExample('PRESENT', 'bg-green-100 text-green-700', item.examples.present, item.word)}
                        ${renderExample('FUTURE', 'bg-blue-100 text-blue-700', item.examples.future, item.word)}
                    </div>
                </div>
            `).join('');
        }

        function renderExample(timeName, badgeColor, data, targetWord) {
            // Екрануємо спецсимволи слова
            const safeWord = targetWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${safeWord})`, 'gi');
            
            // Робимо слово жирним і підкресленим у реченні
            const highlightedSentence = data.sentence.replace(regex, `<span class="font-bold underline decoration-2 underline-offset-4 text-white">$1</span>`);

            return `
                <div class="flex items-start gap-4">
                    <!-- Бадж часу -->
                    <div class="shrink-0 w-24 pt-0.5">
                        <span class="inline-flex w-full justify-center px-2 py-1.5 rounded text-[13px] font-bold uppercase tracking-wider ${badgeColor}">
                            ${timeName}
                        </span>
                    </div>
                    
                    <!-- Блок контенту з перенесенням рядків (text-wrap) -->
                    <div class="flex-1 text-[17px] leading-relaxed">
                        <span class="text-gray-100 font-medium tracking-wide">${data.pattern}</span>
                        <span class="text-gray-400 mx-2 font-bold">→</span>
                        <span class="text-white">${highlightedSentence}</span>
                        <span class="text-gray-300 ml-1 italic">(${data.translation})</span>
                    </div>
                </div>
            `;
        }
