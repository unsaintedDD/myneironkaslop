                <span>🔗 Як ця система пов'язана з іншими приладами на містку</span>
              </h3>
              <span class="text-[11px] text-slate-500 hidden sm:inline">Клікніть на будь-який зв'язок для переходу до вкладки приладу</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- Вхідні потоки -->
              <div class="space-y-2">
                <div class="text-xs font-bold text-emerald-800 uppercase tracking-wide flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                  Звідки отримує дані (Вхід):
                </div>
                <div class="space-y-2">
                  ${inputsHtml}
                </div>
              </div>
              <!-- Вихідні потоки -->
              <div class="space-y-2">
                <div class="text-xs font-bold text-blue-800 uppercase tracking-wide flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                  Куди передає дані (Вихід):
                </div>
                <div class="space-y-2">
                  ${outputsHtml}
                </div>
              </div>
            </div>
          </div>

          <!-- ПАНЕЛЬ КЕРУВАННЯ ВИПАДАЮЧИМИ СПИСКАМИ ВКЛАДКИ -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pt-1">
            <h3 class="text-sm sm:text-base font-bold text-slate-900">
              📚 Детальний конспект розділу (Випадаючі списки по кліку)
            </h3>
            <div class="flex items-center gap-2">
              <button
                onclick="toggleAllInCurrentTab(true)"
                class="px-3 py-1.5 text-xs font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-lg transition"
              >
                + Розгорнути всі списки
              </button>
              <button
                onclick="toggleAllInCurrentTab(false)"
                class="px-3 py-1.5 text-xs font-semibold text-slate-700 bg-white hover:bg-slate-100 border border-slate-300 rounded-lg transition"
              >
                − Згорнути всі списки
              </button>
            </div>
          </div>

          <!-- СПИСОК АКОРДЕОНІВ -->
          <div class="space-y-4">
            ${accordionsHtml}
          </div>

        </div>
      `;
    }

    // Рендер Вкладки 7 (Інтерактивна схема + Пошук усіх абревіатур)
    function renderMatrixTabHtml(tab, theme) {
      const nodeButtonsHtml = matrixNodes.map(n => `
        <button
          onclick="selectMatrixNode('${n.id}')"
          id="btn_${n.id}"
          class="matrix-node-btn p-3 rounded-xl border text-left transition flex flex-col justify-between"
        >
          <span class="font-mono-code text-xs font-bold px-2 py-0.5 rounded w-fit mb-1.5 bg-slate-200 text-slate-800">${n.code}</span>
          <span class="text-xs font-bold text-slate-900 leading-snug">${n.name}</span>
        </button>
      `).join("");

      return `
        <div class="tab-pane space-y-6">
          <div class="${theme.bannerBg} rounded-2xl p-5 sm:p-6 text-white shadow-sm">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-2xl">${tab.icon}</span>
              <span class="font-mono-code text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded bg-white/20 text-white">
                ${tab.badge}
              </span>
            </div>
            <h2 class="text-lg sm:text-2xl font-extrabold">${tab.fullTitle}</h2>
            <p class="text-xs sm:text-sm text-white/90 mt-1">${tab.summary}</p>
          </div>

          <!-- ЧАСТИНА 1: ІНТЕРАКТИВНИЙ КОНСТРУКТОР ЗВ'ЯЗКІВ -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs space-y-4">
            <div>
              <h3 class="text-base font-bold text-slate-900">1. Інтерактивна схема потоків даних: Натисніть на прилад</h3>
              <p class="text-xs text-slate-500">Оберіть будь-яку систему нижче, щоб побачити, з чим вона з'єднана на містку:</p>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5">
              ${nodeButtonsHtml}
            </div>

            <!-- Картка вибраного вузла -->
            <div id="matrixInspector" class="p-4 sm:p-5 rounded-2xl bg-slate-50 border border-slate-200 space-y-4">
              <!-- Заповнюється функцією selectMatrixNode -->
            </div>
          </div>

          <!-- ЧАСТИНА 2: МИТТЄВИЙ ПОШУК ПО ВСІХ АБРЕВІАТУРАХ ТА ТЕРМІНАХ -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h3 class="text-base font-bold text-slate-900">2. Швидкий довідник-пошук усіх абревіатур (42 терміни)</h3>
                <p class="text-xs text-slate-500">Введіть абревіатуру (наприклад: CPA, PAD, CCR, ROT, SART, EBL) або слово українською</p>
              </div>
              <div class="relative w-full sm:w-72">
                <input
                  id="glossarySearchInput"
                  type="text"
                  oninput="filterGlossary(this.value)"
                  placeholder="Пошук (CPA, PAD, GYRO, STW...)"
                  class="w-full pl-9 pr-4 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                >
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
              </div>
            </div>

            <div id="glossaryGrid" class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
              <!-- Заповнюється функцією filterGlossary -->
            </div>
          </div>
        </div>
      `;
    }

    function selectMatrixNode(nodeId) {
      activeMatrixNodeId = nodeId;
      const node = matrixNodes.find(n => n.id === nodeId);
      if (!node) return;

      document.querySelectorAll(".matrix-node-btn").forEach(btn => {
        if (btn.id === `btn_${nodeId}`) {
          btn.className = "matrix-node-btn p-3 rounded-xl border-2 border-blue-600 bg-blue-50/70 text-left transition flex flex-col justify-between shadow-xs";
        } else {
          btn.className = "matrix-node-btn p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-left transition flex flex-col justify-between";
        }
      });

      const inspector = document.getElementById("matrixInspector");
      if (!inspector) return;

      const recHtml = node.receivesFrom.map(r => `<li class="text-xs sm:text-sm text-slate-700">${r}</li>`).join("");
      const sendHtml = node.sendsTo.map(s => `<li class="text-xs sm:text-sm text-slate-700">${s}</li>`).join("");

      inspector.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 pb-3">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-mono-code text-xs font-bold px-2.5 py-1 rounded bg-blue-600 text-white">${node.code}</span>
              <h4 class="text-base font-bold text-slate-900">${node.name}</h4>
            </div>
            <p class="text-xs sm:text-sm text-slate-600 mt-1">${node.role}</p>
          </div>
          <button
            onclick="switchTab('${node.tab}')"
            class="px-4 py-2 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-2xs transition shrink-0 w-fit"
          >
            Відкрити вкладку цього приладу →
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="p-3.5 rounded-xl bg-white border border-emerald-200">
            <div class="text-xs font-bold uppercase text-emerald-800 mb-2">← Отримує вхідні дані від:</div>
            <ul class="list-disc pl-5 space-y-1">${recHtml}</ul>
          </div>
          <div class="p-3.5 rounded-xl bg-white border border-blue-200">
            <div class="text-xs font-bold uppercase text-blue-800 mb-2">→ Передає вихідні дані у:</div>
            <ul class="list-disc pl-5 space-y-1">${sendHtml}</ul>
          </div>
        </div>
      `;
    }

    function filterGlossary(query) {
      const grid = document.getElementById("glossaryGrid");
      if (!grid) return;
      const q = query.trim().toLowerCase();

      const filtered = quickGlossary.filter(item =>
        item.code.toLowerCase().includes(q) ||
        item.name.toLowerCase().includes(q) ||
        item.desc.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-2 p-6 text-center text-xs sm:text-sm text-slate-500">За вашим запитом нічого не знайдено.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="p-3.5 rounded-xl border border-slate-200 bg-slate-50/60 hover:bg-white hover:border-blue-300 transition flex items-start justify-between gap-3">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-mono-code text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-white">${item.code}</span>
              <span class="text-xs sm:text-sm font-bold text-slate-900">${item.name}</span>
            </div>
            <p class="text-xs text-slate-600 mt-1">${item.desc}</p>
          </div>
          <button
            onclick="switchTab('${item.tab}')"
            class="text-[11px] font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded-lg border border-blue-200 shrink-0 transition"
          >
            Вкладка ↗
          </button>
        </div>
      `).join("");
    }

    // Функції для відкриття/закриття випадаючих списків
    function toggleDrop(id, btnEl) {
      const body = document.getElementById(id);
      if (!body) return;
      const isOpen = body.classList.contains("open");
      if (isOpen) {
        body.classList.remove("open");
        if (btnEl) btnEl.classList.remove("open-btn");
      } else {
        body.classList.add("open");
        if (btnEl) btnEl.classList.add("open-btn");
      }
    }

    function toggleAllInCurrentTab(openState) {
      const container = document.getElementById("tabContentArea");
      if (!container) return;
      container.querySelectorAll(".accordion-body").forEach(el => {
        if (openState) el.classList.add("open");
        else el.classList.remove("open");
      });
      container.querySelectorAll("button").forEach(btn => {
        if (btn.querySelector(".chevron")) {
          if (openState) btn.classList.add("open-btn");
          else btn.classList.remove("open-btn");
        }
      });
    }

    // Ініціалізація при завантаженні сторінки
    window.addEventListener("DOMContentLoaded", () => {
      renderTabsNav();
      renderActiveTabContent();
    });
  </script>
</body>
</html>
